<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多体引力模拟器 - 优化积分方法</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        .launch-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 10;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stats-info {
            position: absolute;
            top: 10px;
            right: 120px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 10;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .physics-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 10;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .clear-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 10;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
        
        .clear-button:hover {
            background: rgba(30, 30, 30, 0.8);
        }
        
        .timer-info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 10;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 能量信息面板 */
        .energy-info {
            position: absolute;
            bottom: 10px;
            right: 70px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 10;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 黑白简洁时间控制 */
        .time-control-minimal {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            width: 40px;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 12px 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .time-scale-max-minimal {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 5px;
        }
        
        .time-scale-slider-minimal-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }
        
        .time-scale-slider-minimal {
            -webkit-appearance: none;
            width: 180px;
            height: 4px;
            transform: rotate(-90deg);
            background: linear-gradient(to right, #333, #888);
            border-radius: 2px;
            outline: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .time-scale-slider-minimal:hover {
            opacity: 1;
        }
        
        .time-scale-slider-minimal::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: 2px solid #333;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }
        
        .time-scale-slider-minimal::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: 2px solid #333;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }
        
        .time-scale-display-minimal {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-top: 8px;
        }
        
        .time-scale-min-minimal {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- 发射参数指示器 -->
    <div class="launch-info" id="launchInfo" style="display: none;">
        <div>发射速度: <span id="launchSpeedValue">0.0</span></div>
        <div>发射角度: <span id="launchAngleValue">0°</span></div>
    </div>

    <!-- 统计数据 -->
    <div class="stats-info" id="statsInfo">
        <div>物体数量: <span id="projectileCount">0</span></div>
        <div>体系总质量: <span id="totalMassValue">0.0</span></div>
    </div>

    <!-- 物理信息 -->
    <div class="physics-info" id="physicsInfo">
        <div>引力常数 G: <span id="gravityConstantValue">20000.0</span></div>
        <div>质心状态: <span id="centerStatus">稳定</span></div>
        <div>质心位置偏移: <span id="centerOffset">0.0, 0.0</span></div>
        <div>质心速度: <span id="centerVelocity">0.0, 0.0</span></div>
    </div>

    <!-- 能量信息 -->
    <div class="energy-info" id="energyInfo">
        <div>系统总能量: <span id="totalEnergyValue">0.0</span></div>
        <div>动能: <span id="kineticEnergyValue">0.0</span></div>
        <div>势能: <span id="potentialEnergyValue">0.0</span></div>
    </div>

    <!-- 计时器 -->
    <div class="timer-info" id="timerInfo">
        <div>下次质心重置: <span id="resetTimer">60.0</span>秒</div>
    </div>

    <!-- 黑白简洁时间控制 -->
    <div class="time-control-minimal" id="timeControlMinimal">
        <div class="time-scale-max-minimal">×20</div>
        <div class="time-scale-slider-minimal-container">
            <input type="range" class="time-scale-slider-minimal" id="timeScaleSlider" min="0" max="100" value="0" step="1">
        </div>
        <div class="time-scale-display-minimal" id="timeScaleValue">×1.0</div>
        <div class="time-scale-min-minimal">×1</div>
    </div>

    <!-- 清除按钮 -->
    <div class="clear-button" id="clearButton">清除所有</div>

    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置Canvas尺寸为全屏
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // 初始调整尺寸
        resizeCanvas();
        
        // 窗口大小变化时调整Canvas大小
        window.addEventListener('resize', resizeCanvas);
        
        // 存储所有物体
        let projectiles = [];
        // 轨迹历史
        let trajectoryHistory = [];
        
        // 物理参数 - 固定值
        const G = 20000.0; // 引力常数
        const dt = 0.01; // 时间步长
        const trailLength = 50; // 轨迹长度
        const fixedRadius = 2; // 物体半径
        const fixedMass = 1.0; // 物体质量
        
        // 状态统计
        let stats = {
            totalFired: 0
        };
        
        // 鼠标交互相关
        let isMouseDown = false;
        let mouseStart = { x: 0, y: 0 };
        let mouseCurrent = { x: 0, y: 0 };
        let isDragging = false;
        
        // 速度参数
        const MAX_SPEED = 200.0;  // 最大速度增加到200
        const LOG_BASE = 2.0; // 对数底数
        const MAX_DISTANCE = 1000.0; // 最大拖动距离
        const MIN_DISTANCE = 10.0; // 最小有效拖动距离
        
        // 质心调整
        let centerAdjustment = {
            active: false,
            startTime: 0,
            duration: 3000, // 3秒
            initialCenterPos: { x: 0, y: 0 },
            initialCenterVel: { vx: 0, vy: 0 },
            targetCenterPos: { x: 0, y: 0 },
            targetCenterVel: { vx: 0, vy: 0 }
        };
        
        // 60秒定时器
        let lastResetTime = performance.now();
        const RESET_INTERVAL = 60000; // 60秒
        let timerActive = true; // 定时器是否激活
        
        // 时间流逝参数
        let timeScale = 1.0; // 时间流逝速度，1-20倍
        let updateCounter = 0; // 更新计数器
        
        // 初始化UI元素
        const launchInfo = document.getElementById('launchInfo');
        const launchSpeedValue = document.getElementById('launchSpeedValue');
        const launchAngleValue = document.getElementById('launchAngleValue');
        const projectileCountElement = document.getElementById('projectileCount');
        const totalMassValue = document.getElementById('totalMassValue');
        const statsInfo = document.getElementById('statsInfo');
        const physicsInfo = document.getElementById('physicsInfo');
        const gravityConstantValue = document.getElementById('gravityConstantValue');
        const centerStatus = document.getElementById('centerStatus');
        const centerOffset = document.getElementById('centerOffset');
        const centerVelocity = document.getElementById('centerVelocity');
        const clearButton = document.getElementById('clearButton');
        const timerInfo = document.getElementById('timerInfo');
        const resetTimer = document.getElementById('resetTimer');
        const timeScaleValue = document.getElementById('timeScaleValue');
        const timeScaleSlider = document.getElementById('timeScaleSlider');
        const timeControlMinimal = document.getElementById('timeControlMinimal');
        const energyInfo = document.getElementById('energyInfo');
        const totalEnergyValue = document.getElementById('totalEnergyValue');
        const kineticEnergyValue = document.getElementById('kineticEnergyValue');
        const potentialEnergyValue = document.getElementById('potentialEnergyValue');
        
        // 计算线性速度 - 使用对数映射
        function calculateLinearSpeed(distance) {
            if (distance < MIN_DISTANCE) {
                return 0;
            }
            
            const k = 100.0; // 缩放因子
            const scaledDistance = distance / k;
            const maxScaledDistance = MAX_DISTANCE / k;
            
            const logValue = Math.log(1 + scaledDistance);
            const maxLogValue = Math.log(1 + maxScaledDistance);
            
            let speed = MAX_SPEED * (logValue / maxLogValue);
            
            return Math.min(speed, MAX_SPEED);
        }
        
        // 计算系统质心位置
        function calculateCenterOfMassPosition() {
            if (projectiles.length === 0) {
                return { x: canvas.width / 2, y: canvas.height / 2 };
            }
            
            let totalMass = 0;
            let sumX = 0;
            let sumY = 0;
            
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                totalMass += p.mass;
                sumX += p.mass * p.x;
                sumY += p.mass * p.y;
            }
            
            return {
                x: sumX / totalMass,
                y: sumY / totalMass
            };
        }
        
        // 计算系统质心速度
        function calculateCenterOfMassVelocity() {
            if (projectiles.length === 0) {
                return { vx: 0, vy: 0 };
            }
            
            let totalMass = 0;
            let sumVx = 0;
            let sumVy = 0;
            
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                totalMass += p.mass;
                sumVx += p.mass * p.vx;
                sumVy += p.mass * p.vy;
            }
            
            return {
                vx: sumVx / totalMass,
                vy: sumVy / totalMass
            };
        }
        
        // 计算系统总质量
        function calculateTotalMass() {
            let totalMass = 0;
            for (let i = 0; i < projectiles.length; i++) {
                totalMass += projectiles[i].mass;
            }
            return totalMass;
        }
        
        // 计算系统总能量
        function calculateSystemEnergy() {
            if (projectiles.length === 0) {
                return { kinetic: 0, potential: 0, total: 0 };
            }
            
            let kineticEnergy = 0;
            let potentialEnergy = 0;
            
            // 计算动能
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                const speedSquared = p.vx * p.vx + p.vy * p.vy;
                kineticEnergy += 0.5 * p.mass * speedSquared;
            }
            
            // 计算势能
            for (let i = 0; i < projectiles.length; i++) {
                for (let j = i + 1; j < projectiles.length; j++) {
                    const p1 = projectiles[i];
                    const p2 = projectiles[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance > 0.001) { // 避免除零
                        potentialEnergy -= G * p1.mass * p2.mass / distance;
                    }
                }
            }
            
            const totalEnergy = kineticEnergy + potentialEnergy;
            
            return {
                kinetic: kineticEnergy,
                potential: potentialEnergy,
                total: totalEnergy
            };
        }
        
        // 更新能量显示
        function updateEnergyDisplay() {
            const energy = calculateSystemEnergy();
            kineticEnergyValue.textContent = energy.kinetic.toFixed(2);
            potentialEnergyValue.textContent = energy.potential.toFixed(2);
            totalEnergyValue.textContent = energy.total.toFixed(2);
        }
        
        // 开始质心调整
        function startCenterAdjustment() {
            if (projectiles.length === 0) {
                centerAdjustment.active = false;
                centerStatus.textContent = '稳定';
                return;
            }
            
            const centerPos = calculateCenterOfMassPosition();
            const centerVel = calculateCenterOfMassVelocity();
            
            const canvasCenterX = canvas.width / 2;
            const canvasCenterY = canvas.height / 2;
            
            const posOffsetX = centerPos.x - canvasCenterX;
            const posOffsetY = centerPos.y - canvasCenterY;
            
            const posDistance = Math.sqrt(posOffsetX * posOffsetX + posOffsetY * posOffsetY);
            const velDistance = Math.sqrt(centerVel.vx * centerVel.vx + centerVel.vy * centerVel.vy);
            
            if (posDistance < 0.1 && velDistance < 0.01) {
                centerStatus.textContent = '稳定';
                return;
            }
            
            centerAdjustment.active = true;
            centerAdjustment.startTime = performance.now();
            centerAdjustment.initialCenterPos = centerPos;
            centerAdjustment.initialCenterVel = centerVel;
            centerAdjustment.targetCenterPos = { x: canvasCenterX, y: canvasCenterY };
            centerAdjustment.targetCenterVel = { vx: 0, vy: 0 };
            
            centerStatus.textContent = '调整中';
        }
        
        // 更新质心调整
        function updateCenterAdjustment() {
            if (!centerAdjustment.active) return;
            
            const currentTime = performance.now();
            const elapsed = currentTime - centerAdjustment.startTime;
            const progress = Math.min(elapsed / centerAdjustment.duration, 1);
            
            const easeProgress = easeInOutCubic(progress);
            
            const targetPosX = centerAdjustment.initialCenterPos.x + 
                (centerAdjustment.targetCenterPos.x - centerAdjustment.initialCenterPos.x) * easeProgress;
            const targetPosY = centerAdjustment.initialCenterPos.y + 
                (centerAdjustment.targetCenterPos.y - centerAdjustment.initialCenterPos.y) * easeProgress;
            
            const targetVelX = centerAdjustment.initialCenterVel.vx + 
                (centerAdjustment.targetCenterVel.vx - centerAdjustment.initialCenterVel.vx) * easeProgress;
            const targetVelY = centerAdjustment.initialCenterVel.vy + 
                (centerAdjustment.targetCenterVel.vy - centerAdjustment.initialCenterVel.vy) * easeProgress;
            
            const currentCenterPos = calculateCenterOfMassPosition();
            const currentCenterVel = calculateCenterOfMassVelocity();
            
            const posAdjustX = targetPosX - currentCenterPos.x;
            const posAdjustY = targetPosY - currentCenterPos.y;
            const velAdjustX = targetVelX - currentCenterVel.vx;
            const velAdjustY = targetVelY - currentCenterVel.vy;
            
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                p.x += posAdjustX;
                p.y += posAdjustY;
                p.vx += velAdjustX;
                p.vy += velAdjustY;
            }
            
            if (progress >= 1) {
                centerAdjustment.active = false;
                centerStatus.textContent = '稳定';
            }
        }
        
        // 检查是否需要重置质心
        function checkResetTimer() {
            if (!timerActive) return;
            
            const currentTime = performance.now();
            const elapsed = currentTime - lastResetTime;
            
            const remainingTime = Math.max(0, (RESET_INTERVAL - elapsed) / 1000);
            resetTimer.textContent = remainingTime.toFixed(1);
            
            if (elapsed >= RESET_INTERVAL) {
                startCenterAdjustment();
                lastResetTime = currentTime;
                resetTimer.textContent = (RESET_INTERVAL / 1000).toFixed(1);
            }
        }
        
        // 缓动函数
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        
        // 初始化UI事件监听
        function initUI() {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
            canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
            
            clearButton.addEventListener('click', () => {
                projectiles = [];
                trajectoryHistory = [];
                centerAdjustment.active = false;
                updateStats();
                updateEnergyDisplay();
                centerStatus.textContent = '稳定';
                lastResetTime = performance.now();
            });
            
            timeScaleSlider.addEventListener('input', () => {
                const sliderValue = parseInt(timeScaleSlider.value);
                timeScale = Math.pow(20, sliderValue / 100);
                timeScaleValue.textContent = '×' + timeScale.toFixed(1);
            });
            
            gravityConstantValue.textContent = G.toFixed(1);
            resetTimer.textContent = (RESET_INTERVAL / 1000).toFixed(1);
        }
        
        // 触摸事件处理
        function handleTouchStart(e) {
            e.preventDefault();
            if (e.touches.length === 1) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                mouseStart.x = touch.clientX - rect.left;
                mouseStart.y = touch.clientY - rect.top;
                isMouseDown = true;
            }
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if (isMouseDown && e.touches.length === 1) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                mouseCurrent.x = touch.clientX - rect.left;
                mouseCurrent.y = touch.clientY - rect.top;
                isDragging = true;
                updateLaunchInfo();
            }
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            if (isDragging && isMouseDown) {
                const rect = canvas.getBoundingClientRect();
                if (e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    mouseCurrent.x = touch.clientX - rect.left;
                    mouseCurrent.y = touch.clientY - rect.top;
                    
                    const dx = mouseCurrent.x - mouseStart.x;
                    const dy = mouseCurrent.y - mouseStart.y;
                    let angle = Math.atan2(dy, dx);
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    const speed = calculateLinearSpeed(distance);
                    
                    fireProjectile(mouseStart.x, mouseStart.y, angle, speed);
                    launchInfo.style.display = 'none';
                }
            }
            isMouseDown = false;
            isDragging = false;
        }
        
        // 鼠标按下事件
        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            mouseStart.x = e.clientX - rect.left;
            mouseStart.y = e.clientY - rect.top;
            isMouseDown = true;
        }
        
        // 鼠标移动事件
        function handleMouseMove(e) {
            if (!isMouseDown) return;
            
            const rect = canvas.getBoundingClientRect();
            mouseCurrent.x = e.clientX - rect.left;
            mouseCurrent.y = e.clientY - rect.top;
            isDragging = true;
            updateLaunchInfo();
        }
        
        // 鼠标释放事件
        function handleMouseUp(e) {
            if (isDragging && isMouseDown) {
                const rect = canvas.getBoundingClientRect();
                mouseCurrent.x = e.clientX - rect.left;
                mouseCurrent.y = e.clientY - rect.top;
                
                const dx = mouseCurrent.x - mouseStart.x;
                const dy = mouseCurrent.y - mouseStart.y;
                let angle = Math.atan2(dy, dx);
                const distance = Math.sqrt(dx*dx + dy*dy);
                const speed = calculateLinearSpeed(distance);
                
                fireProjectile(mouseStart.x, mouseStart.y, angle, speed);
                launchInfo.style.display = 'none';
            }
            isMouseDown = false;
            isDragging = false;
        }
        
        // 更新发射信息显示
        function updateLaunchInfo() {
            const dx = mouseCurrent.x - mouseStart.x;
            const dy = mouseCurrent.y - mouseStart.y;
            let angle = Math.atan2(dy, dx);
            let angleDeg = angle * 180 / Math.PI;
            if (angleDeg < 0) angleDeg += 360;
            
            const distance = Math.sqrt(dx*dx + dy*dy);
            const speed = calculateLinearSpeed(distance);
            
            launchSpeedValue.textContent = speed.toFixed(2);
            launchAngleValue.textContent = Math.round(angleDeg) + '°';
            launchInfo.style.display = 'block';
        }
        
        // 从指定位置发射物体
        function fireProjectile(startX, startY, angle, speed) {
            const vx = speed * Math.cos(angle);
            const vy = speed * Math.sin(angle);
            
            addProjectile(startX, startY, vx, vy, fixedMass, fixedRadius);
        }
        
        // 添加物体
        function addProjectile(x, y, vx, vy, mass, radius) {
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                const dx = x - p.x;
                const dy = y - p.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < radius + p.radius) {
                    const angle = Math.atan2(dy, dx);
                    x = p.x + (radius + p.radius + 1) * Math.cos(angle);
                    y = p.y + (radius + p.radius + 1) * Math.sin(angle);
                }
            }
            
            projectiles.push({
                x, y,
                vx, vy,
                mass: mass,
                radius: radius,
                color: '#4CAF50',
                trail: []
            });
            
            stats.totalFired++;
            startCenterAdjustment();
            updateStats();
        }
        
        // 更新统计数据
        function updateStats() {
            projectileCountElement.textContent = projectiles.length;
            totalMassValue.textContent = calculateTotalMass().toFixed(2);
            
            if (projectiles.length > 0) {
                const centerPos = calculateCenterOfMassPosition();
                const centerVel = calculateCenterOfMassVelocity();
                const canvasCenterX = canvas.width / 2;
                const canvasCenterY = canvas.height / 2;
                
                const offsetX = (centerPos.x - canvasCenterX).toFixed(1);
                const offsetY = (centerPos.y - canvasCenterY).toFixed(1);
                centerOffset.textContent = `${offsetX}, ${offsetY}`;
                centerVelocity.textContent = `${centerVel.vx.toFixed(2)}, ${centerVel.vy.toFixed(2)}`;
            } else {
                centerOffset.textContent = '0.0, 0.0';
                centerVelocity.textContent = '0.0, 0.0';
            }
        }
        
        // 计算两个物体之间的引力
        function calculateGravity(obj1, obj2, distance) {
            const force = G * (obj1.mass * obj2.mass) / (distance * distance);
            return Number.parseFloat(force.toFixed(12));
        }
        
        // 计算物体的加速度 - 优化版本
        function calculateAcceleration(p, projectiles) {
            let ax = 0;
            let ay = 0;
            const softening = 0.5; // 软化长度，避免除零和过大的力
            
            for (let j = 0; j < projectiles.length; j++) {
                const p2 = projectiles[j];
                if (p === p2) continue;
                
                const dx = p2.x - p.x;
                const dy = p2.y - p.y;
                const distanceSquared = dx*dx + dy*dy;
                const distance = Math.sqrt(distanceSquared);
                
                if (distance < 0.001) continue; // 避免除零
                
                // 使用软化长度计算力，避免距离过小时力过大
                const force = G * (p.mass * p2.mass) / (distanceSquared + softening*softening);
                const acceleration = force / p.mass;
                
                // 归一化方向向量
                const invDistance = 1.0 / distance;
                ax += acceleration * dx * invDistance;
                ay += acceleration * dy * invDistance;
            }
            
            return { ax, ay };
        }
        
        // 自适应时间步长的四阶龙格-库塔辛方法
        function updateProjectilesAdaptiveRK4() {
            const adaptiveDt = dt * (1.0 / Math.sqrt(timeScale)); // 时间流逝越快，步长越小以提高精度
            
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                
                p.trail.push({x: p.x, y: p.y});
                if (p.trail.length > trailLength) {
                    p.trail.shift();
                }
                
                // 保存初始状态
                const x0 = p.x;
                const y0 = p.y;
                const vx0 = p.vx;
                const vy0 = p.vy;
                
                // 计算k1
                const k1v = calculateAcceleration(p, projectiles);
                const k1x = { x: vx0, y: vy0 };
                
                // 中间状态1
                const x1 = x0 + 0.5 * adaptiveDt * k1x.x;
                const y1 = y0 + 0.5 * adaptiveDt * k1x.y;
                const vx1 = vx0 + 0.5 * adaptiveDt * k1v.ax;
                const vy1 = vy0 + 0.5 * adaptiveDt * k1v.ay;
                
                // 计算k2
                const tempP1 = {...p, x: x1, y: y1, vx: vx1, vy: vy1};
                const tempProjectiles1 = projectiles.map((pj, idx) => 
                    idx === i ? tempP1 : pj
                );
                const k2v = calculateAcceleration(tempP1, tempProjectiles1);
                const k2x = { x: vx1, y: vy1 };
                
                // 中间状态2
                const x2 = x0 + 0.5 * adaptiveDt * k2x.x;
                const y2 = y0 + 0.5 * adaptiveDt * k2x.y;
                const vx2 = vx0 + 0.5 * adaptiveDt * k2v.ax;
                const vy2 = vy0 + 0.5 * adaptiveDt * k2v.ay;
                
                // 计算k3
                const tempP2 = {...p, x: x2, y: y2, vx: vx2, vy: vy2};
                const tempProjectiles2 = projectiles.map((pj, idx) => 
                    idx === i ? tempP2 : pj
                );
                const k3v = calculateAcceleration(tempP2, tempProjectiles2);
                const k3x = { x: vx2, y: vy2 };
                
                // 中间状态3
                const x3 = x0 + adaptiveDt * k3x.x;
                const y3 = y0 + adaptiveDt * k3x.y;
                const vx3 = vx0 + adaptiveDt * k3v.ax;
                const vy3 = vy0 + adaptiveDt * k3v.ay;
                
                // 计算k4
                const tempP3 = {...p, x: x3, y: y3, vx: vx3, vy: vy3};
                const tempProjectiles3 = projectiles.map((pj, idx) => 
                    idx === i ? tempP3 : pj
                );
                const k4v = calculateAcceleration(tempP3, tempProjectiles3);
                const k4x = { x: vx3, y: vy3 };
                
                // 更新位置和速度
                p.x = x0 + (adaptiveDt / 6) * (k1x.x + 2*k2x.x + 2*k3x.x + k4x.x);
                p.y = y0 + (adaptiveDt / 6) * (k1x.y + 2*k2x.y + 2*k3x.y + k4x.y);
                p.vx = vx0 + (adaptiveDt / 6) * (k1v.ax + 2*k2v.ax + 2*k3v.ax + k4v.ax);
                p.vy = vy0 + (adaptiveDt / 6) * (k1v.ay + 2*k2v.ay + 2*k3v.ay + k4v.ay);
            }
            
            // 检查碰撞
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                
                for (let j = 0; j < projectiles.length; j++) {
                    if (i === j) continue;
                    
                    const p2 = projectiles[j];
                    const dx = p2.x - p.x;
                    const dy = p2.y - p.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distance < p.radius + p2.radius) {
                        const totalMass = p.mass + p2.mass;
                        
                        p.x = ((p.x * p.mass + p2.x * p2.mass) / totalMass);
                        p.y = ((p.y * p.mass + p2.y * p2.mass) / totalMass);
                        
                        p.vx = ((p.vx * p.mass + p2.vx * p2.mass) / totalMass);
                        p.vy = ((p.vy * p.mass + p2.vy * p2.mass) / totalMass);
                        
                        p.mass = totalMass;
                        
                        projectiles.splice(j, 1);
                        if (j < i) i--;
                        break;
                    }
                }
            }
            
            // 存储轨迹历史点
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                trajectoryHistory.push({x: p.x, y: p.y});
            }
            
            if (trajectoryHistory.length > 1000) {
                trajectoryHistory.splice(0, trajectoryHistory.length - 1000);
            }
            
            // 如果物体飞出画布太远，移除它
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                if (p.x < -2000 || p.x > canvas.width + 2000 || 
                    p.y < -2000 || p.y > canvas.height + 2000) {
                    projectiles.splice(i, 1);
                    i--;
                }
            }
            
            updateStats();
            updateEnergyDisplay();
        }
        
        // 绘制物体
        function drawProjectiles() {
            for (let i = 0; i < trajectoryHistory.length; i++) {
                const point = trajectoryHistory[i];
                ctx.beginPath();
                ctx.arc(point.x, point.y, 0.8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(100, 149, 237, 0.3)';
                ctx.fill();
            }
            
            for (let i = 0; i < projectiles.length; i++) {
                const p = projectiles[i];
                
                if (p.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    
                    for (let j = 1; j < p.trail.length; j++) {
                        ctx.lineTo(p.trail[j].x, p.trail[j].y);
                    }
                    
                    ctx.strokeStyle = 'rgba(76, 175, 80, 0.8)';
                    ctx.lineWidth = 2.0;
                    ctx.stroke();
                }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#4CAF50';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
            }
        }
        
        // 绘制鼠标拖拽指示器
        function drawDragIndicator() {
            if (!isMouseDown || !isDragging) return;
            
            const dx = mouseCurrent.x - mouseStart.x;
            const dy = mouseCurrent.y - mouseStart.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            ctx.beginPath();
            ctx.moveTo(mouseStart.x, mouseStart.y);
            ctx.lineTo(mouseCurrent.x, mouseCurrent.y);
            ctx.strokeStyle = '#FF5722';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(mouseStart.x, mouseStart.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#FF5722';
            ctx.fill();
            
            const speed = calculateLinearSpeed(distance);
            ctx.fillStyle = '#FF5722';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`速度: ${speed.toFixed(2)}`, mouseStart.x, mouseStart.y - 10);
            
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            const angleDeg = angle < 0 ? angle + 360 : angle;
            ctx.fillText(`角度: ${Math.round(angleDeg)}°`, mouseStart.x, mouseStart.y - 22);
        }
        
        // 绘制函数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawProjectiles();
            drawDragIndicator();
        }
        
        // 时间流逝调节函数
        function updateWithTimeScale() {
            updateCounter++;
            
            const updatesPerFrame = Math.floor(timeScale);
            
            for (let i = 0; i < updatesPerFrame; i++) {
                checkResetTimer();
                updateCenterAdjustment();
                updateProjectilesAdaptiveRK4();
            }
            
            const fractionalPart = timeScale - updatesPerFrame;
            if (Math.random() < fractionalPart) {
                checkResetTimer();
                updateCenterAdjustment();
                updateProjectilesAdaptiveRK4();
            }
        }
        
        // 动画循环
        let lastTime = 0;
        const fps = 120;
        const frameInterval = 1000 / fps;
        
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = currentTime - lastTime;
            
            if (deltaTime > frameInterval) {
                lastTime = currentTime - (deltaTime % frameInterval);
                
                updateWithTimeScale();
                draw();
            }
        }
        
        // 初始化
        function init() {
            initUI();
            requestAnimationFrame(animate);
        }
        
        // 启动应用
        init();
    </script>
</body>
